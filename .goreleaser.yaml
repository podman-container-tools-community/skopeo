# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Runs in a checkout of upstream skopeo at a release tag, with this repository in
# .build/ (see .github/actions/setup):
#   goreleaser release --config .build/.goreleaser.yaml
# goreleaser takes the module, go.sum and tag from the upstream checkout.
# The binaries are still built from the Go module proxy and verified against
# sum.golang.org (gomod.proxy), so neither the checkout nor this repository can alter
# the source.
# SYSROOT holds the C headers and static libraries for both architectures
# (hack/build-sysroot.sh); zig is the C compiler, so both architectures build on one
# runner. The image is built separately by hack/build-image.sh.
# GPG_KEY_PATH names the GPG private key that signs the deb and rpm packages; unset
# means unsigned. IS_LATEST=true marks upstream's latest release.
version: 2

project_name: skopeo

gomod:
  proxy: true
  env:
    - GOPROXY=https://proxy.golang.org
    - GOSUMDB=sum.golang.org
    - GOFLAGS=-mod=mod

builds:
  # skopeo needs cgo for rootless containers-storage: containers/storage enters the user
  # namespace from a C constructor (pkg/unshare); without it skopeo re-executes itself
  # forever. Linked statically against musl with zig as C compiler, so both architectures
  # build on one runner.
  - id: skopeo
    main: ./cmd/skopeo
    binary: skopeo
    env:
      - CGO_ENABLED=1
      # Setting CGO_CFLAGS replaces Go's default "-O2 -g"; without -O2 zig compiles in
      # debug mode with the UBSan runtime, whose symbols nothing provides. go-sqlite3 uses
      # the *64 functions such as pread64, which musl 1.2.4 only declares with
      # _LARGEFILE64_SOURCE. Before 1.16, hack/musl-compat.h (in the sysroot) declares
      # basename().
      - CGO_CFLAGS=-O2 -g -D_LARGEFILE64_SOURCE{{ if and (eq .Major 1) (lt .Minor 16) }} -include {{ .Env.SYSROOT }}/musl-compat.h{{ end }}
      # zig cc cross-compiles both architectures against musl.
      - >-
        {{- if and (eq .Os "linux") (eq .Arch "amd64") }}CC=zig cc -target x86_64-linux-musl{{- end }}
        {{- if and (eq .Os "linux") (eq .Arch "arm64") }}CC=zig cc -target aarch64-linux-musl{{- end }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64: [v1]
    goarm64: [v8.0]
    flags:
      - -trimpath
    # Everything that needs shared C libraries is left out:
    # - containers_image_openpgp: pure-Go OpenPGP instead of gpgme; no GPG signing
    # - exclude_graphdriver_btrfs: btrfs driver needs libbtrfs headers
    # - exclude_graphdriver_devicemapper: devicemapper needs libdevmapper;
    #   upstream stopped setting it in 1.16; it is harmless for newer versions
    # Not set: libsubid, libsqlite3 (go-sqlite3 uses its bundled SQLite instead).
    tags:
      - containers_image_openpgp
      - exclude_graphdriver_btrfs
      - exclude_graphdriver_devicemapper
    ldflags:
      - -s -w
      # zig links the C parts; -s there strips their debug info too.
      - -linkmode external -extldflags '-static -s'
      # Upstream's Makefile sets this up to 1.20. From 1.21 on, gitCommit is a function
      # reading VCS info from the build, which a module proxy build has none of, and the
      # linker ignores this flag.
      - -X main.gitCommit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: skopeo
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: default-policy.json
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

# Replace the distribution's skopeo package. Epoch 2 sorts above every distribution
# version (Fedora uses epoch 1, Debian appends +ds1), so upgrades do not switch back.
# /etc/containers/policy.json belongs to the distribution's containers-common, so
# upstream's default is shipped as documentation only.
nfpms:
  - id: skopeo
    ids: [skopeo]
    package_name: skopeo
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    vendor: podman-container-tools-community
    homepage: "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    maintainer: podman-container-tools-community <https://github.com/{{ .Env.GITHUB_REPOSITORY }}/issues>
    description: |-
      Community-built static skopeo (upstream: github.com/podman-container-tools/skopeo).
      Work with remote container images and registries.
    license: Apache-2.0
    bindir: /usr/bin
    epoch: "2"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/skopeo/LICENSE
      - src: default-policy.json
        dst: /usr/share/doc/skopeo/default-policy.json
    # Signed with the repository's GPG key (packaging/gpg.asc) when GPG_KEY_PATH is set;
    # the passphrase comes from NFPM_PASSPHRASE.
    rpm:
      group: Applications/System
      signature:
        key_file: '{{ envOrDefault "GPG_KEY_PATH" "" }}'
    deb:
      signature:
        key_file: '{{ envOrDefault "GPG_KEY_PATH" "" }}'
    # policy.json is required: without it every skopeo command that reads an image
    # fails ("open /etc/containers/policy.json: no such file or directory"), and
    # --no-install-recommends (common in CI images) would skip a Recommends. Debian and
    # Ubuntu ship it in golang-github-containers-common.
    overrides:
      deb:
        dependencies:
          - golang-github-containers-common | containers-common
      rpm:
        dependencies:
          - containers-common
    mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum

release:
  # Published by release.yaml once the apt repository files are uploaded.
  draft: true
  replace_existing_draft: true
  # The checkout's origin is upstream; releases go to this repository instead.
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: '{{ envOrDefault "GITHUB_REPOSITORY_NAME" .ProjectName }}'
  make_latest: '{{ eq (envOrDefault "IS_LATEST" "false") "true" }}'
  prerelease: auto
  header: |
    Community-maintained static build of [skopeo {{ .Tag }}](https://github.com/podman-container-tools/skopeo/releases/tag/{{ .Tag }}).
    Not an official release of the skopeo project.

    Built with cgo, linked statically against musl (zig), with tags `containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_devicemapper`.
    Known limitations: no GPG signing (`--sign-by`, `standalone-sign`; GPG verification and sigstore work), no btrfs driver, no libsubid, no NSS.
    Sources were fetched from proxy.golang.org and verified against sum.golang.org;
    check with `go version -m skopeo-linux-amd64`.

changelog:
  disable: true
