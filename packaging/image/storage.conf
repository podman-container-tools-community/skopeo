# Storage configuration for use inside the image, after upstream's quay.io/skopeo/stable
# image: fuse-overlayfs, because a container cannot mount a native overlay on top of its
# own overlay file system, and /var/lib/shared as an additional (read-only) image store.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = [
  "/var/lib/shared",
]

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
