name: test

# Builds one upstream release without publishing anything, runs the functional tests
# (hack/functional-test.sh) against the amd64 binary and builds and tests the image
# (hack/image-test.sh). Both run bats-core; each test case shows up in the log.
#
# Upstream's integration tests are not run: for older releases they depend on registry
# content that has changed since (registry.k8s.io tag lists), an OpenShift 1.5 cluster
# and the VM setup of upstream's CI, so they fail for reasons unrelated to the binary.

on:
  workflow_call:
    inputs:
      version:
        description: Upstream tag, e.g. v1.24.1
        type: string
        required: true
      cache:
        description: Restore and save the C sysroot in the Actions cache (pull request CI only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/skopeo
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .build
          persist-credentials: false

      - uses: ./.build/.github/actions/setup
        with:
          version: ${{ inputs.version }}
          cache: ${{ inputs.cache }}

      - name: Build
        run: goreleaser release --config "${GORELEASER_CONFIG}" --clean --skip=publish,sign

      - name: Smoke test
        run: |
          go version -m dist/skopeo_linux_amd64_v1/skopeo
          dist/skopeo_linux_amd64_v1/skopeo --version
          file dist/skopeo_linux_amd64_v1/skopeo dist/skopeo_linux_arm64_v8.0/skopeo | tee /dev/stderr | grep -c 'statically linked' | grep -qx 2

      # Ubuntu 26.04, like 24.04, denies unprivileged user namespaces to unconfined
      # processes, which the rootless tests need.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Functional tests
        run: .build/hack/functional-test.sh dist/skopeo_linux_amd64_v1/skopeo localhost:5000

      - name: Image tests
        run: .build/hack/image-test.sh dist
