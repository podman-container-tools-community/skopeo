name: test

# Builds one upstream release without publishing anything, runs the functional tests
# (hack/functional-test.sh) against the amd64 binary and builds and tests the image
# (hack/image-test.sh). Both run bats-core; each test case shows up in the log.
#
# Upstream's integration tests are not run: for older releases they depend on registry
# content that has changed since (registry.k8s.io tag lists), an OpenShift 1.5 cluster
# and the VM setup of upstream's CI, so they fail for reasons unrelated to the binary.

on:
  workflow_call:
    inputs:
      version:
        description: Upstream tag, e.g. v1.24.1
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/skopeo
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .build
          persist-credentials: false

      - uses: ./.build/.github/actions/setup
        with:
          version: ${{ inputs.version }}

      # dockers_v2 builds and pushes in one step, so a dry run cannot build images.
      - name: Build
        run: goreleaser release --config .build/.goreleaser.yaml --clean --skip=publish,sign,docker
        env:
          IS_LATEST: "false"
          IS_LATEST_MINOR: "false"
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Smoke test
        run: |
          go version -m dist/skopeo_linux_amd64_v1/skopeo
          dist/skopeo_linux_amd64_v1/skopeo --version
          file dist/skopeo_linux_amd64_v1/skopeo dist/skopeo_linux_arm64_v8.0/skopeo | tee /dev/stderr | grep -c 'statically linked' | grep -qx 2

      # bats from .build/mise.toml, checked against .build/mise.lock. Its bin directory,
      # not the shims, goes on PATH, so bats also runs outside .build/.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: .build
          add_shims_to_path: false
          cache: false

      - name: Functional tests
        run: .build/hack/functional-test.sh dist/skopeo_linux_amd64_v1/skopeo localhost:5000

      - name: Image tests
        run: .build/hack/image-test.sh dist default-policy.json
