name: renovate hooks

# mise lock records no checksum for bats-core, whose releases publish none. On Renovate's
# pull requests that touch mise.toml this runs hack/update-checksums.sh, which refreshes
# mise.lock and adds the missing SHA-256, and if mise.lock changed, commits the result to
# the pull request branch with the automation GitHub App. Commits made with GITHUB_TOKEN
# would not trigger the pull request's checks again.

on:
  pull_request:
    branches: [main]
    paths:
      - mise.toml
      - mise.lock

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checksums:
    name: Update checksums
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
          cache: false

      - name: Update checksums
        id: update
        env:
          # mise lock looks up releases through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          hack/update-checksums.sh
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.update.outputs.changed == 'true'
        id: app-token
        with:
          client-id: ${{ secrets.APP_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.APP_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write

      # createCommitOnBranch makes a commit signed by GitHub. expectedHeadOid makes it
      # fail if Renovate pushed to the branch in the meantime.
      - name: Commit checksums
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          bot="${APP_SLUG}[bot]"
          id="$(gh api "users/${bot}" --jq .id)"
          additions="$(git diff --name-only -z | while IFS= read -r -d '' path; do
            jq -n --arg path "${path}" --arg contents "$(base64 -w 0 "${path}")" \
              '{path: $path, contents: $contents}'
          done | jq -s .)"
          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg body "Recomputed by hack/update-checksums.sh.

          Signed-off-by: ${bot} <${id}+${bot}@users.noreply.github.com>" \
            --argjson additions "${additions}" \
            --arg head "${HEAD_SHA}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) { commit { url } }
              }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: "Update pinned checksums", body: $body},
                fileChanges: {additions: $additions},
                expectedHeadOid: $head
              }}
            }' |
            gh api graphql --input - --jq .data.createCommitOnBranch.commit.url
