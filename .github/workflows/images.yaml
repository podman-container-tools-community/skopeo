name: images

# Builds, tests, pushes and signs the images of one release from the archives of its
# GitHub release, verified against the cosign-signed checksums.txt that release.yaml
# made, so the images contain the released binaries by construction and no toolchain
# is needed. Called by release.yaml (immutable: true, from the archives it just
# uploaded) and by rebuild.yaml, so every image, released or rebuilt, is signed by this
# file: images.yaml@refs/heads/main. Every image passes test/image.bats before it is
# pushed.

on:
  workflow_call:
    inputs:
      version:
        description: Upstream tag, e.g. v1.24.1
        type: string
        required: true
      immutable:
        description: Also push vX.Y.Z-immutable (the release only; an existing tag is kept)
        type: boolean
        default: false
      artifact:
        description: Actions artifact with the archives and checksums, instead of the release's assets (release.yaml, whose release is still a draft)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-26.04
    permissions:
      contents: read # release assets
      packages: write # ghcr.io
      id-token: write # cosign keyless signing
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # The signing identity is this file at refs/heads/main: github.ref is the caller's ref.
      - name: Check ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::images.yaml signs as images.yaml@refs/heads/main and must be called on main, not ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cosign and bats from mise.toml, checked against mise.lock.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: cosign bats
          add_shims_to_path: false
          cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exact names: a stray asset must not come along with the signed files.
      - name: Download the release
        if: inputs.artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir release \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json \
            --pattern "skopeo_${VERSION#v}_linux_amd64.tar.gz" --pattern "skopeo_${VERSION#v}_linux_arm64.tar.gz"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: release

      # The archives are trusted through the cosign signature on checksums.txt, which
      # release.yaml made. The upstream commit and its date go into the image annotations.
      - name: Verify the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          cosign verify-blob release/checksums.txt --bundle release/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          (cd release && sha256sum --check --ignore-missing --strict checksums.txt)
          commit="$(gh api "repos/podman-container-tools/skopeo/commits/${VERSION}")"
          {
            echo "REVISION=$(jq -r .sha <<< "${commit}")"
            echo "CREATED=$(jq -r .commit.committer.date <<< "${commit}")"
          } >> "$GITHUB_ENV"

      # Floating tags: latest and vX follow the newest upstream release, vX.Y the newest
      # release of that minor. The newest by version, not upstream's GitHub "latest"
      # flag: that flag moves to a backport release of an older minor unless upstream
      # resets it.
      - name: Check floating tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          releases="$(hack/upstream-releases.sh)"
          latest="$(tail -1 <<<"${releases}")"
          latest_minor="$(grep -F "${VERSION%.*}." <<<"${releases}" | tail -1)"
          {
            echo "IS_LATEST=$([[ "${VERSION}" == "${latest}" ]] && echo true || echo false)"
            echo "IS_LATEST_MINOR=$([[ "${VERSION}" == "${latest_minor}" ]] && echo true || echo false)"
          } >> "$GITHUB_ENV"

      # Ubuntu 26.04, like 24.04, denies unprivileged user namespaces to unconfined
      # processes, which the rootless tests need.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The same build as below, loaded instead of pushed; the push is a cache hit.
      - name: Test the image
        run: hack/image-test.sh release

      - name: Push and sign images
        env:
          IMMUTABLE: ${{ inputs.immutable }}
        run: hack/build-image.sh --push release "ghcr.io/${GITHUB_REPOSITORY}"
