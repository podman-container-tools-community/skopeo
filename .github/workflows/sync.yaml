name: sync

# Starts release.yaml on main for every upstream release (hack/upstream-releases.sh)
# that has no published release here yet, after creating the release's tag on the
# repository's first commit. The tag only anchors the GitHub release and never moves;
# release.yaml always runs the current main. A release that failed or was never
# dispatched is picked up again on the next run, unless a release run for it is still
# queued or running.
#
# Does nothing until the repository variable RELEASES_ENABLED is set to true (Settings,
# Secrets and variables, Actions, Variables), so main can be merged before releasing.
# At most MAX_RELEASES_PER_RUN (repository variable, default 10) releases are started per
# run, newest first, so the first run over every upstream release does not flood the
# runners and quay.io's pull limits; the rest follow with the next runs.

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create tags
      actions: write # dispatch release.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the first commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Tag and dispatch releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_RELEASES_PER_RUN: ${{ vars.MAX_RELEASES_PER_RUN || 10 }}
        run: |
          set -o pipefail
          # Assigned first: a failure inside the for list would go unnoticed.
          tags="$(hack/upstream-releases.sh | tac)"
          root="$(git rev-list --max-parents=0 HEAD | tail -1)"
          started=0
          for tag in ${tags}; do
            # Published release: done. Only "no release" (404) means work to do; any
            # other API error must not start a second release.
            if published="$(gh api "repos/${GH_REPO}/releases/tags/${tag}" --jq .draft 2>&1)"; then
              [[ "${published}" == true ]] || continue
            elif ! grep -q 'HTTP 404' <<<"${published}"; then
              echo "${published}" >&2
              echo "::error::cannot tell whether ${tag} has a release"
              exit 1
            fi
            # A release run for the version (run-name) is queued or running: leave it alone.
            active="$(gh run list --repo "${GH_REPO}" --workflow release.yaml --limit 100 \
              --json displayTitle,status \
              --jq '[.[] | select(.displayTitle == "'"${tag}"'" and .status != "completed")] | length')"
            if [[ "${active}" != 0 ]]; then
              continue
            fi
            if ((started >= MAX_RELEASES_PER_RUN)); then
              echo "::notice::${tag} waits for the next run (MAX_RELEASES_PER_RUN=${MAX_RELEASES_PER_RUN})"
              continue
            fi
            started=$((started + 1))
            # The tag anchors the GitHub release on the first commit; a retry keeps it.
            if existing="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq .object.sha 2>&1)"; then
              echo "::notice::${tag} is tagged (${existing}) but has no published release, starting release.yaml again"
            elif grep -q 'HTTP 404' <<<"${existing}"; then
              echo "Tagging ${tag} at ${root}"
              gh api --method POST "repos/${GH_REPO}/git/refs" \
                -f "ref=refs/tags/${tag}" \
                -f "sha=${root}"
            else
              echo "${existing}" >&2
              echo "::error::cannot tell whether ${tag} is tagged"
              exit 1
            fi
            gh workflow run release.yaml --ref main -f "version=${tag}"
          done
