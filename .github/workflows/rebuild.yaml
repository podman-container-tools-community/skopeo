name: rebuild

# Rebuilds the images of existing releases with the current Dockerfile (images.yaml),
# so they pick up base image and package updates. The GitHub releases, packages and
# vX.Y.Z-immutable tags are not touched.
# By default only the newest release of every minor is rebuilt; the all input rebuilds
# every release, the version input one release. Gated by the repository variable
# RELEASES_ENABLED like sync.yaml.

on:
  schedule:
    - cron: "23 4 * * 1"
  # A merged base image bump (Renovate) or image change rebuilds right away.
  push:
    branches: [main]
    paths:
      - Dockerfile
      - packaging/image/**
      - hack/build-image.sh
  workflow_dispatch:
    inputs:
      all:
        description: Rebuild every release instead of only the newest release of each minor
        type: boolean
        default: false
      version:
        description: Rebuild only this release, e.g. v1.24.1
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  releases:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-26.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty for schedule and push, which have no inputs.
          ALL: ${{ inputs.all }}
          ONLY: ${{ inputs.version }}
        run: |
          set -o pipefail
          if [[ -n "${ONLY}" ]]; then
            tags="${ONLY}"
          else
            tags="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases \
              --limit 1000 --json tagName --jq '.[].tagName' | sort -V)"
            if [[ -z "${tags}" ]]; then
              echo "::error::no releases found"
              exit 1
            fi
            if [[ "${ALL:-false}" != "true" ]]; then
              tags="$(tac <<< "${tags}" | sort -uV -t. -k1,2)"
            fi
          fi
          echo "versions=$(jq -Rnc '[inputs]' <<< "${tags}")" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: releases
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: ${{ fromJSON(needs.releases.outputs.versions) }}
    name: ${{ matrix.version }}
    uses: ./.github/workflows/images.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ matrix.version }}
