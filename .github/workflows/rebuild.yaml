name: rebuild

# Rebuilds the images of existing releases with the current Dockerfile, so they pick up
# base image and package updates. The binaries come from the GitHub release's archives,
# checked against its cosign-signed checksums.txt, so the images contain the released
# binaries by construction and no toolchain is needed. The GitHub releases, packages and
# vX.Y.Z-immutable tags are not touched.
# By default only the newest release of every minor is rebuilt; the all input rebuilds
# every release, the version input one release. Gated by the repository variable
# RELEASES_ENABLED like sync.yaml.

on:
  schedule:
    - cron: "23 4 * * 1"
  # A merged base image bump (Renovate) or image change rebuilds right away.
  push:
    branches: [main]
    paths:
      - Dockerfile
      - packaging/image/**
      - hack/build-image.sh
  workflow_dispatch:
    inputs:
      all:
        description: Rebuild every release instead of only the newest release of each minor
        type: boolean
        default: false
      version:
        description: Rebuild only this release, e.g. v1.24.1
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  releases:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-26.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty for schedule and push, which have no inputs.
          ALL: ${{ inputs.all }}
          ONLY: ${{ inputs.version }}
        run: |
          set -o pipefail
          if [[ -n "${ONLY}" ]]; then
            tags="${ONLY}"
          else
            tags="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases \
              --limit 1000 --json tagName --jq '.[].tagName' | sort -V)"
            if [[ -z "${tags}" ]]; then
              echo "::error::no releases found"
              exit 1
            fi
            if [[ "${ALL:-false}" != "true" ]]; then
              tags="$(tac <<< "${tags}" | sort -uV -t. -k1,2)"
            fi
          fi
          echo "versions=$(jq -Rnc '[inputs]' <<< "${tags}")" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: releases
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: ${{ fromJSON(needs.releases.outputs.versions) }}
    name: ${{ matrix.version }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read # release assets
      packages: write # ghcr.io
      id-token: write # cosign keyless signing
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The archives of the release, verified through the cosign signature on
      # checksums.txt, which release.yaml made. The upstream commit and its date go into
      # the image annotations, as in the release.
      - name: Download and verify the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir release \
            --pattern 'checksums.txt*' --pattern '*_linux_amd64.tar.gz' --pattern '*_linux_arm64.tar.gz'
          cosign verify-blob release/checksums.txt --bundle release/checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          (cd release && sha256sum --check --ignore-missing --strict checksums.txt)
          commit="$(gh api "repos/podman-container-tools/skopeo/commits/${VERSION}")"
          {
            echo "REVISION=$(jq -r .sha <<< "${commit}")"
            echo "CREATED=$(jq -r .commit.committer.date <<< "${commit}")"
          } >> "$GITHUB_ENV"

      - name: Check floating tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          releases="$(hack/upstream-releases.sh)"
          latest="$(tail -1 <<<"${releases}")"
          latest_minor="$(grep -F "${VERSION%.*}." <<<"${releases}" | tail -1)"
          {
            echo "IS_LATEST=$([[ "${VERSION}" == "${latest}" ]] && echo true || echo false)"
            echo "IS_LATEST_MINOR=$([[ "${VERSION}" == "${latest_minor}" ]] && echo true || echo false)"
          } >> "$GITHUB_ENV"

      - name: Rebuild and push images
        run: hack/build-image.sh --push release "ghcr.io/${GITHUB_REPOSITORY}"
