name: ci

# Builds and tests the newest upstream release of every minor version without
# publishing anything.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-26.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Newest release per minor, e.g. ["v1.11.5", ..., "v1.24.1"]
      - id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          versions="$(hack/upstream-releases.sh | tac | sort -uV -t. -k1,2 | jq -Rnc '[inputs]')"
          if [[ "${versions}" == "[]" ]]; then
            echo "::error::no upstream releases found"
            exit 1
          fi
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  test:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    name: ${{ matrix.version }}
    uses: ./.github/workflows/test.yaml
    with:
      version: ${{ matrix.version }}

  # Single job to mark as required: runs once every job above has finished, passes only
  # when all of them succeeded, fails when any failed, was cancelled or was skipped.
  fail:
    if: ${{ always() }}
    needs:
      - versions
      - test
    runs-on: ubuntu-26.04
    steps:
      - name: Verify checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != success ]]; then
              echo "::error::Some checks have failed!"
              exit 1
            fi
          done
