name: release
run-name: ${{ inputs.version }}

# Releases the upstream version given as input: GitHub release with binaries, signed
# deb/rpm packages, apt repository, SBOMs, cosign signature and build provenance, then
# the images on ghcr.io through images.yaml. test.yaml (build and functional tests) has
# to pass first, and the release stays a draft until the images are pushed.
#
# Runs on main only, so every release is built by the current pipeline and signed with
# one identity: release.yaml@refs/heads/main for checksums.txt, images.yaml@refs/heads/main
# for the images. The release's tag is created by sync.yaml on the repository's first
# commit: it anchors the GitHub release and nothing else; the pipeline commit is named
# in the release notes. Started by sync.yaml, or by hand:
#   gh workflow run release.yaml --ref main -f version=v1.24.1
# Images of existing releases are rebuilt by rebuild.yaml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream tag, e.g. v1.24.1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Before the long build: the ref, for the signing identity, and the release's tag.
  check:
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release.yaml must run on main (--ref main), not ${GITHUB_REF}"
          exit 1

      # The tag anchors the GitHub release; goreleaser would otherwise create it on main.
      - name: Check tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --silent; then
            echo "::error::no tag ${VERSION} in this repository; sync.yaml creates it"
            exit 1
          fi

  test:
    needs: check
    uses: ./.github/workflows/test.yaml
    with:
      version: ${{ inputs.version }}

  release:
    needs: test
    runs-on: ubuntu-26.04
    name: release (${{ inputs.version }})
    permissions:
      contents: write # GitHub release
      id-token: write # cosign keyless signing and attestations
      attestations: write
    outputs:
      latest: ${{ steps.floating.outputs.latest }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/skopeo
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .build
          persist-credentials: false

      - uses: ./.build/.github/actions/setup
        with:
          version: ${{ inputs.version }}

      # latest and vX follow the newest upstream release by version, not upstream's
      # GitHub "latest" flag: that flag moves to a backport release of an older minor
      # unless upstream resets it, and with it make_latest and the apt repository.
      - name: Check floating tags
        id: floating
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          releases="$(.build/hack/upstream-releases.sh)"
          latest="$(tail -1 <<<"${releases}")"
          is_latest="$([[ "${VERSION}" == "${latest}" ]] && echo true || echo false)"
          echo "IS_LATEST=${is_latest}" >> "$GITHUB_ENV"
          echo "latest=${is_latest}" >> "$GITHUB_OUTPUT"

      # Key for the deb/rpm signatures and the apt repository (packaging/gpg.asc).
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          key="${RUNNER_TEMP}/gpg-private.asc"
          printf '%s\n' "${GPG_PRIVATE_KEY}" > "${key}"
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 --import "${key}" <<< "${GPG_PASSPHRASE}"
          echo "GPG_KEY_PATH=${key}" >> "$GITHUB_ENV"

      - name: Release
        run: goreleaser release --config "${GORELEASER_CONFIG}" --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          PIPELINE_COMMIT: ${{ github.sha }}
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Flat apt repository in the release assets; packaging/apt/skopeo.sources points at
      # releases/latest/download, which follows the newest upstream release. goreleaser
      # leaves the release as a draft, so it is published only with these files.
      - name: Add apt repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: 59E1335F8162F5DFFE1D4DA97243E2C2DA6280BC
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y --no-install-recommends apt-utils
          mkdir "${RUNNER_TEMP}/apt"
          cp dist/*.deb "${RUNNER_TEMP}/apt/"
          cd "${RUNNER_TEMP}/apt"
          apt-ftparchive packages . > Packages
          xz -k Packages
          apt-ftparchive release . > "${RUNNER_TEMP}/Release"
          mv "${RUNNER_TEMP}/Release" Release
          sign() {
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "${GPG_FINGERPRINT}" "$@" <<< "${GPG_PASSPHRASE}"
          }
          sign --clearsign -o InRelease Release
          sign --armor --detach-sign -o Release.gpg Release
          gh release upload "${VERSION}" Packages Packages.xz Release InRelease Release.gpg \
            --repo "${GITHUB_REPOSITORY}" --clobber

      # Before the release is published: a failed attestation leaves a draft, which the
      # next sync.yaml run replaces.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The archives for images.yaml: the release is still a draft, whose assets a job
      # with contents: read cannot download. overwrite: a re-run of this job in the same
      # workflow run uploads the name again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.version }}
          overwrite: true
          path: |
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/*_linux_amd64.tar.gz
            dist/*_linux_arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Remove GPG key
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/gpg-private.asc"
          gpgconf --kill gpg-agent

  images:
    needs: release
    uses: ./.github/workflows/images.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version: ${{ inputs.version }}
      immutable: true
      artifact: release-${{ inputs.version }}

  publish:
    needs: [release, images]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # publish the release
    env:
      VERSION: ${{ inputs.version }}
      IS_LATEST: ${{ needs.release.outputs.latest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish release
        run: gh release edit "${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest="${IS_LATEST}"
