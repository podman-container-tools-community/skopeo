name: release
run-name: ${{ github.ref_name }}

# Releases the upstream version named by the tag this workflow runs on: GitHub release
# with binaries, signed deb/rpm packages, apt repository, SBOMs and cosign signature,
# images on ghcr.io, and build provenance.
# test.yaml (build and functional tests) has to pass first.
#
# Started by sync.yaml, or by hand for an existing tag:
#   gh workflow run release.yaml --ref v1.24.1
#
# With the images input, run on main, it rebuilds, pushes and signs only the images of an
# existing release with the current Dockerfile, e.g. after a base image change:
#   gh workflow run release.yaml --ref main -f images=v1.24.1
# Tags point at the commit that was current when they were created, so a run on the tag
# would use that commit's Dockerfile.

on:
  workflow_dispatch:
    inputs:
      images:
        description: Only rebuild the images of this existing release, e.g. v1.24.1 (run on main)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.images || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    with:
      version: ${{ inputs.images || github.ref_name }}

  release:
    needs: test
    runs-on: ubuntu-26.04
    name: release (${{ inputs.images || github.ref_name }})
    permissions:
      contents: write # GitHub release
      packages: write # ghcr.io
      id-token: write # cosign keyless signing and attestations
      attestations: write
    env:
      VERSION: ${{ inputs.images || github.ref_name }}
      IMAGES_ONLY: ${{ inputs.images != '' }}
    steps:
      - name: Check ref
        run: |
          if [[ "${IMAGES_ONLY}" == "false" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::release.yaml must run on a tag (--ref <tag>), not ${GITHUB_REF}"
            exit 1
          fi
          if [[ "${IMAGES_ONLY}" == "true" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "::error::images rebuilds run on a branch (--ref main), not ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/skopeo
          ref: refs/tags/${{ env.VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .build
          persist-credentials: false

      - uses: ./.build/.github/actions/setup
        with:
          version: ${{ env.VERSION }}

      # Rebuilt images have to contain the released binaries: build them with the Go
      # version of the release, and compare checksums after the build.
      - name: Download release checksums
        id: release
        if: env.IMAGES_ONLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --pattern checksums.txt --pattern skopeo-linux-amd64 --dir "${RUNNER_TEMP}/release"
          go_version="$(go version "${RUNNER_TEMP}/release/skopeo-linux-amd64" | awk '{print $2}')"
          echo "go-version=${go_version#go}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.IMAGES_ONLY == 'true'
        with:
          go-version: ${{ steps.release.outputs.go-version }}
          cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Floating tags: latest and vX follow upstream's latest release, vX.Y the newest
      # release of that minor.
      - name: Check floating tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Highest release, not GitHub's "latest" flag, which moves to a backport release
          # of an older minor (e.g. v1.22.3 after v1.24.1) unless upstream unsets it.
          latest="$(.build/hack/upstream-releases.sh | tail -1)"
          latest_minor="$(.build/hack/upstream-releases.sh | grep -F "${VERSION%.*}." | tail -1)"
          {
            echo "IS_LATEST=$([[ "${VERSION}" == "${latest}" ]] && echo true || echo false)"
            echo "IS_LATEST_MINOR=$([[ "${VERSION}" == "${latest_minor}" ]] && echo true || echo false)"
          } >> "$GITHUB_ENV"

      # Key for the deb/rpm signatures and the apt repository (packaging/gpg.asc).
      - name: Import GPG key
        if: env.IMAGES_ONLY == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          key="${RUNNER_TEMP}/gpg-private.asc"
          printf '%s\n' "${GPG_PRIVATE_KEY}" > "${key}"
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 --import "${key}" <<< "${GPG_PASSPHRASE}"
          echo "GPG_KEY_PATH=${key}" >> "$GITHUB_ENV"

      - name: Release
        if: env.IMAGES_ONLY == 'false'
        run: goreleaser release --config .build/.goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # IMAGES_ONLY disables the GitHub release in .goreleaser.yaml.
      # Build and compare first; dockers_v2 pushes while it builds, so a mismatch found
      # after a full run would already have replaced the published tags.
      - name: Rebuild images
        if: env.IMAGES_ONLY == 'true'
        run: |
          goreleaser release --config .build/.goreleaser.yaml --clean --skip=docker,publish,sign,sbom,nfpm
          binaries=' skopeo-linux-(amd64|arm64)$'
          diff <(grep -E "${binaries}" "${RUNNER_TEMP}/release/checksums.txt") <(grep -E "${binaries}" dist/checksums.txt)
          goreleaser release --config .build/.goreleaser.yaml --clean --skip=nfpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

      # Flat apt repository in the release assets; packaging/apt/skopeo.sources points at
      # releases/latest/download, which follows upstream's latest release. goreleaser
      # leaves the release as a draft, so it is published only with these files.
      - name: Add apt repository
        if: env.IMAGES_ONLY == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: 59E1335F8162F5DFFE1D4DA97243E2C2DA6280BC
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y --no-install-recommends apt-utils
          mkdir "${RUNNER_TEMP}/apt"
          cp dist/*.deb "${RUNNER_TEMP}/apt/"
          cd "${RUNNER_TEMP}/apt"
          apt-ftparchive packages . > Packages
          xz -k Packages
          apt-ftparchive release . > "${RUNNER_TEMP}/Release"
          mv "${RUNNER_TEMP}/Release" Release
          sign() {
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "${GPG_FINGERPRINT}" "$@" <<< "${GPG_PASSPHRASE}"
          }
          sign --clearsign -o InRelease Release
          sign --armor --detach-sign -o Release.gpg Release
          gh release upload "${GITHUB_REF_NAME}" Packages Packages.xz Release InRelease Release.gpg \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Publish release
        if: env.IMAGES_ONLY == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest="${IS_LATEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.IMAGES_ONLY == 'false'
        with:
          subject-checksums: dist/checksums.txt

      - name: Remove GPG key
        if: always() && env.IMAGES_ONLY == 'false'
        run: |
          rm -f "${RUNNER_TEMP}/gpg-private.asc"
          gpgconf --kill gpg-agent
