name: release
run-name: ${{ github.ref_name }}

# Releases the upstream version named by the tag this workflow runs on: GitHub release
# with binaries, SBOMs and cosign signature, images on ghcr.io, and build provenance.
# test.yaml (build and functional tests) has to pass first.
#
# Started by sync.yaml, or by hand for an existing tag:
#   gh workflow run release.yaml --ref v1.24.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: test
    runs-on: ubuntu-latest
    name: release (${{ github.ref_name }})
    permissions:
      contents: write # GitHub release
      packages: write # ghcr.io
      id-token: write # cosign keyless signing and attestations
      attestations: write
    steps:
      - name: Check ref
        if: github.ref_type != 'tag'
        run: |
          echo "::error::release.yaml must run on a tag (--ref <tag>), not ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/skopeo
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .build
          persist-credentials: false

      - uses: ./.build/.github/actions/setup
        with:
          version: ${{ github.ref_name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Floating tags: latest and vX follow upstream's latest release, vX.Y the newest
      # release of that minor.
      - name: Check floating tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/podman-container-tools/skopeo/releases/latest --jq .tag_name)"
          latest_minor="$(.build/hack/upstream-releases.sh | grep -F "${GITHUB_REF_NAME%.*}." | tail -1)"
          {
            echo "IS_LATEST=$([[ "${GITHUB_REF_NAME}" == "${latest}" ]] && echo true || echo false)"
            echo "IS_LATEST_MINOR=$([[ "${GITHUB_REF_NAME}" == "${latest_minor}" ]] && echo true || echo false)"
          } >> "$GITHUB_ENV"

      - name: Release
        run: goreleaser release --config .build/.goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
