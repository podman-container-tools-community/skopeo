name: release
run-name: ${{ github.ref_name }}

# Releases the upstream version named by the tag this workflow runs on: GitHub release
# with binaries, signed deb/rpm packages, apt repository, SBOMs and cosign signature,
# images on ghcr.io (hack/build-image.sh), and build provenance.
# test.yaml (build and functional tests) has to pass first.
#
# Started by sync.yaml, or by hand for an existing tag:
#   gh workflow run release.yaml --ref v1.24.1
# Images of existing releases are rebuilt by rebuild.yaml.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: test
    runs-on: ubuntu-26.04
    name: release (${{ github.ref_name }})
    permissions:
      contents: write # GitHub release
      packages: write # ghcr.io
      id-token: write # cosign keyless signing and attestations
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Check ref
        if: github.ref_type != 'tag'
        run: |
          echo "::error::release.yaml must run on a tag (--ref <tag>), not ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/skopeo
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .build
          persist-credentials: false

      - uses: ./.build/.github/actions/setup
        with:
          version: ${{ github.ref_name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Floating tags: latest and vX follow the newest upstream release, vX.Y the newest
      # release of that minor. The newest by version, not upstream's GitHub "latest"
      # flag: that flag moves to a backport release of an older minor unless upstream
      # resets it, and with it latest, vX, make_latest and the apt repository.
      - name: Check floating tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          releases="$(.build/hack/upstream-releases.sh)"
          latest="$(tail -1 <<<"${releases}")"
          latest_minor="$(grep -F "${VERSION%.*}." <<<"${releases}" | tail -1)"
          {
            echo "IS_LATEST=$([[ "${VERSION}" == "${latest}" ]] && echo true || echo false)"
            echo "IS_LATEST_MINOR=$([[ "${VERSION}" == "${latest_minor}" ]] && echo true || echo false)"
          } >> "$GITHUB_ENV"

      # Key for the deb/rpm signatures and the apt repository (packaging/gpg.asc).
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          key="${RUNNER_TEMP}/gpg-private.asc"
          printf '%s\n' "${GPG_PRIVATE_KEY}" > "${key}"
          gpg --batch --pinentry-mode loopback --passphrase-fd 0 --import "${key}" <<< "${GPG_PASSPHRASE}"
          echo "GPG_KEY_PATH=${key}" >> "$GITHUB_ENV"

      - name: Release
        run: goreleaser release --config "${GORELEASER_CONFIG}" --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # From the binaries goreleaser just built, with the vX.Y.Z-immutable tag only the
      # release pushes. Annotated with the upstream commit of the checkout.
      - name: Build and push images
        run: |
          REVISION="$(git rev-parse HEAD)" CREATED="$(git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" \
            IMMUTABLE=true .build/hack/build-image.sh --push dist "ghcr.io/${GITHUB_REPOSITORY}"
        env:
          TZ: UTC

      # Flat apt repository in the release assets; packaging/apt/skopeo.sources points at
      # releases/latest/download, which follows the newest upstream release. goreleaser
      # leaves the release as a draft, so it is published only with these files.
      - name: Add apt repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: 59E1335F8162F5DFFE1D4DA97243E2C2DA6280BC
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y --no-install-recommends apt-utils
          mkdir "${RUNNER_TEMP}/apt"
          cp dist/*.deb "${RUNNER_TEMP}/apt/"
          cd "${RUNNER_TEMP}/apt"
          apt-ftparchive packages . > Packages
          xz -k Packages
          apt-ftparchive release . > "${RUNNER_TEMP}/Release"
          mv "${RUNNER_TEMP}/Release" Release
          sign() {
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "${GPG_FINGERPRINT}" "$@" <<< "${GPG_PASSPHRASE}"
          }
          sign --clearsign -o InRelease Release
          sign --armor --detach-sign -o Release.gpg Release
          gh release upload "${VERSION}" Packages Packages.xz Release InRelease Release.gpg \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest="${IS_LATEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Remove GPG key
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/gpg-private.asc"
          gpgconf --kill gpg-agent
