name: Set up build
description: >-
  Expects upstream skopeo checked out at a release tag in the workspace root and this
  repository in .build/. Hides .build/ from git, so goreleaser sees a clean upstream
  checkout, installs Go, the tools from mise.toml (zig, goreleaser, syft, cosign, bats)
  and builds the C sysroot (hack/build-sysroot.sh).

inputs:
  version:
    description: Upstream tag being built, e.g. v1.24.1
    required: true
  cache:
    description: >-
      Restore the C sysroot from the Actions cache, and save it there on a miss. For pull
      request CI only: releases always build it from source.
    default: "false"

runs:
  using: composite
  steps:
    # setup-zig keeps zig's caches in .zig-cache/ of the workspace.
    - name: Hide .build from git
      shell: bash
      run: |
        printf '/.build/\n/dist/\n/.zig-cache/\n' >> .git/info/exclude
        if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
          git status --short --untracked-files=all
          echo "::error::upstream checkout is not clean"
          exit 1
        fi

    # The newest Go, except where it breaks a release's pinned dependencies: 1.23.x does
    # not build with Go 1.27 (grpc: undefined: http2.TrailerPrefix).
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ startsWith(inputs.version, 'v1.23.') && '1.26' || 'stable' }}
        check-latest: true
        cache: false

    # Never switch to the toolchain named in go.mod.
    - name: Pin Go toolchain
      shell: bash
      run: echo GOTOOLCHAIN=local >> "$GITHUB_ENV"

    # zig, goreleaser, syft and bats from .build/mise.toml, checked against .build/mise.lock
    # (versions and download checksums). Their bin directories, not the shims, go on PATH,
    # so the tools also run outside .build/.
    - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        working_directory: .build
        add_shims_to_path: false
        cache: false

    # C headers and static libraries the build needs, for both architectures. Pull request
    # CI caches the sysroot (inputs.cache); releases always build it from source. The key
    # holds everything it depends on: the build script with its version pins,
    # musl-compat.h, zig, the runner image and the architecture. Binaries linked against
    # a cached sysroot are byte-identical to ones linked against a fresh build.
    - name: Sysroot cache key
      id: sysroot
      shell: bash
      env:
        SCRIPT_HASH: ${{ hashFiles('.build/hack/build-sysroot.sh', '.build/hack/musl-compat.h') }}
      run: echo "key=sysroot-zig$(zig version)-${ImageOS}-${RUNNER_ARCH}-${SCRIPT_HASH}" >> "$GITHUB_OUTPUT"

    - name: Restore sysroot
      id: restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sysroot
        key: ${{ steps.sysroot.outputs.key }}

    - name: Build sysroot
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: .build/hack/build-sysroot.sh "${RUNNER_TEMP}/sysroot"

    - name: Save sysroot
      if: inputs.cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sysroot
        key: ${{ steps.sysroot.outputs.key }}

    - name: Set SYSROOT
      shell: bash
      run: | # zizmor: ignore[github-env] only a fixed path goes into GITHUB_ENV
        echo "SYSROOT=${RUNNER_TEMP}/sysroot" >> "$GITHUB_ENV"

    # goreleaser's gomod.proxy refuses go.mod replace directives, which a module proxy
    # build would ignore. Such releases are built from the checkout and its vendor
    # directory instead.
    - name: Pick goreleaser configuration
      shell: bash
      run: | # zizmor: ignore[github-env] only a fixed path goes into GITHUB_ENV
        config=.build/.goreleaser.yaml
        if grep -qE '^replace|=>' go.mod; then
          echo "::notice::go.mod has replace directives, building from the checkout instead of the Go module proxy"
          config="${RUNNER_TEMP}/goreleaser.yaml"
          sed 's/^  proxy: true$/  proxy: false/' .build/.goreleaser.yaml > "${config}"
          grep -qx '  proxy: false' "${config}"
        fi
        echo "GORELEASER_CONFIG=${config}" >> "$GITHUB_ENV"

    # Fetches the modules the build needs before goreleaser starts, retrying on errors:
    # proxy.golang.org sometimes cuts a download off (stream error, INTERNAL_ERROR).
    # goreleaser retries only its `go get` of the module and only on a 404, and go build
    # does not retry at all. The modules land in the module cache, checked against go.sum
    # and sum.golang.org, where goreleaser's build finds them. A build from the checkout
    # uses its vendor directory and downloads nothing.
    - name: Download Go modules
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GOPROXY: https://proxy.golang.org
        GOSUMDB: sum.golang.org
      run: |
        grep -qx '  proxy: true' "${GORELEASER_CONFIG}" || exit 0
        module="$(go list -m)"
        for attempt in 1 2 3 4 5; do
          if go mod download && go mod download "${module}@${VERSION}"; then
            exit 0
          fi
          echo "::warning::go mod download failed (attempt ${attempt} of 5)"
          sleep $((attempt * 15))
        done
        echo "::error::go mod download failed 5 times"
        exit 1
